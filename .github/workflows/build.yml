name: Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server/index.js
      - run: node --check server/rate-limit.js
      - run: node --check server/asset-metadata.js
      - run: node --check server/chat-input.js
      - run: node --check server/scene-actions.js
      - run: npm run build
      - run: npm test
